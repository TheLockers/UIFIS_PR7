
name: .NET Code Quality

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Восстанавливаем NuGet-пакеты
      - name: Restore dependencies
        run: dotnet restore UIFIS_PR7/UIFIS_PR7.csproj

      # Проверяем форматирование
      - name: Check formatting
        run: dotnet format UIFIS_PR7/UIFIS_PR7.csproj --verify-no-changes

      # Проверяем анализаторы
      - name: Run analyzers
        run: dotnet format analyzers UIFIS_PR7/UIFIS_PR7.csproj --verify-no-changes

      # Собираем проект
      - name: Build project
        run: dotnet build UIFIS_PR7/UIFIS_PR7.csproj --no-restore
